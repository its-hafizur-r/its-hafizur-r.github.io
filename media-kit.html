<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
<link rel="icon" href="assets/avatar.svg">
<title>Media kit · Hafizur (@hafizur_r)</title>
<meta name="description" content="Media kit for travel and lifestyle creator @hafizur_r: live TikTok stats, audience and top videos.">
<meta property="og:title" content="Media kit · @hafizur_r">
<meta property="og:description" content="Live TikTok stats, audience and top videos.">
<meta property="og:image" content="assets/avatar.jpg">
</head>
<body data-page="kit">
  <div class="sky"><svg class="plane" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></div>
  <main class="wrap">
    <header class="hero">
      <img id="avatar" class="avatar" src="assets/avatar.jpg" alt="Hafizur" onerror="this.onerror=null;this.src='assets/avatar.svg'">
      <div class="eyebrow">Media kit</div>
      <h1 data-name>Hafizur</h1>
      <div id="handle" class="handle">@hafizur_r</div>
      <div class="pill-row"><span id="place"></span></div>
      <p id="intro" class="intro"></p>
      <div class="pill-row no-print" style="margin-top:18px">
        <a class="btn" data-mail href="#">Work with me</a>
        <a class="btn ghost" href="index.html">All links</a>
      </div>
    </header>

    <section>
      <div class="eyebrow">TikTok, live</div>
      <h2>The numbers</h2>
      <div id="stats" class="stat-grid"></div>
      <p id="stats-note" class="note"></p>
    </section>

    <section>
      <div class="eyebrow">Who's watching</div>
      <h2>Audience</h2>
      <div id="audience" class="aud-grid"></div>
      <p id="aud-note" class="note"></p>
    </section>

    <section>
      <div class="eyebrow">Most watched</div>
      <h2>Top videos</h2>
      <div id="videos" class="vid-grid"></div>
    </section>

    <section>
      <div class="eyebrow">What I make</div>
      <h2>Content</h2>
      <div id="pillars" class="chips"></div>
    </section>

    <section id="brands-sec">
      <div class="eyebrow">Featured</div>
      <h2>Brands &amp; places</h2>
      <div id="brands" class="chips"></div>
    </section>

    <section>
      <div class="eyebrow">Ways to work together</div>
      <h2>Collaborations</h2>
      <div id="services" class="svc-grid"></div>
    </section>

    <section class="cta">
      <h2>Let's make something</h2>
      <p id="email-text" style="user-select:all"></p>
      <a class="btn" data-mail href="#">Email me</a>
    </section>

    <footer><span id="updated"></span> · <a href="index.html">Links</a> · <a href="privacy.html">Privacy</a></footer>
  </main>
  <script src="app.js?v=5"></script>
</body>
</html>
